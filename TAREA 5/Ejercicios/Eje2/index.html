<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Micro-Framework CSS</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <div class="contenedor mt-lg">
    <h1>Micro-Framework CSS</h1>
    <p class="mb-lg">
      Botones generados automáticamente desde un mapa Sass con contraste accesible.
    </p>

    <div class="fila mb-lg">
      <div class="col-12">
        <button class="btn btn-primario">Primario</button>
        <button class="btn btn-secundario">Secundario</button>
        <button class="btn btn-acento">Acento</button>
        <button class="btn btn-peligro">Peligro</button>
        <button class="btn btn-advertencia">Advertencia</button>
        <button class="btn btn-exito">Éxito</button>
      </div>
    </div>

    <div class="fila">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="bg-primario p-md">Tarjeta primaria</div>
      </div>
      <div class="col-12 col-md-6 col-lg-4">
        <div class="bg-advertencia p-md">Tarjeta advertencia</div>
      </div>
      <div class="col-12 col-md-12 col-lg-4">
        <div class="bg-peligro p-md">Tarjeta peligro</div>
      </div>
    </div>
  </div>
</body>
</html>
